[project]
name = "mock-carrier"
version = "0.1.0"
description = "CAMARA-conformant mock carrier with scenario engine, clock, subscriptions and admin API."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
mock-carrier = "mock_carrier.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_carrier"]
