[project]
name = "tower-mcp"
version = "0.1.0"
description = "The Tower MCP server: line_is_ok, is_reachable, watch_line."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "tower-policy",
  "tower-consent",
  "tower-audit",
  "camara-client",
  "fastmcp>=4.0",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.9",
  "opentelemetry-api>=1.20",  # tower.line_id on the tool span (audit reconciliation, prompt 13)
]

[project.scripts]
tower-mcp = "tower_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_mcp"]
