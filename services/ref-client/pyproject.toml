[project]
name = "ref-client"
version = "0.1.0"
description = "Reference client: a Bedrock agent driving Tower over MCP; demo, corpus and transcript harness."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "fastmcp>=4.0",
  "httpx>=0.27",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
ref-client = "ref_client.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ref_client"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/ref-client/system.md" = "ref_client/_data/system.md"
"corpus/phrasings.yaml" = "ref_client/_data/phrasings.yaml"
