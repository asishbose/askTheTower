# The phrasing corpus (docs/architecture/components/09-reference-client.md §3).
# One entry = one thing a person might say to the speaker, and what the model should do with it:
#   expect: { tool: <name>, args: {...} }   call this tool with these arguments (unlisted args: defaults)
#   expect: { tool: null }                  answer without calling any tool
#   expect: { clarify: true }               call no tool; ask which line
#   expect_any: [ ... ]                     any one of these is a pass (edge cases only)
# Written from how people actually talk about their phone, not from the tool names. The user speaking is
# Asish: he holds his own line ("self") and has been granted Mom's line under the alias "mom".
# No numbers and no health words in here: transcripts quote these sentences.

# --- line_is_ok -------------------------------------------------------------------------------------------
- say: "my phone just lost signal, is my line ok?"
  tags: [line_is_ok, demo]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "is anything forwarding my calls"
  tags: [line_is_ok, demo]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "did my sim get jacked"
  tags: [line_is_ok, slang]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "has somebody hijacked my number"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "my phone says no service out of nowhere, did someone swap my sim"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "is my phone number safe right now"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "are my calls getting redirected somewhere"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "is mom's line ok"
  tags: [line_is_ok, demo]
  expect: { tool: line_is_ok, args: { line: mom } }
- say: "check if anyone messed with my mom's sim"
  tags: [line_is_ok, slang]
  expect: { tool: line_is_ok, args: { line: mom } }
- say: "are mom's calls being forwarded"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: mom } }
- say: "yo is my number still mine or did somebody port it"
  tags: [line_is_ok, slang]
  expect: { tool: line_is_ok, args: { line: self } }
- say: "my bank text never came, is my line alright"
  tags: [line_is_ok]
  expect: { tool: line_is_ok, args: { line: self } }

