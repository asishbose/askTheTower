# --- watch_line -------------------------------------------------------------------------------------------
- say: "watch mom's line for me"
  tags: [watch_line, demo]
  expect: { tool: watch_line, args: { line: mom, enable: true } }
- say: "text me if anything happens to mom's sim"
  tags: [watch_line]
  expect: { tool: watch_line, args: { line: mom, enable: true } }
- say: "stop watching mom's line"
  tags: [watch_line]
  expect: { tool: watch_line, args: { line: mom, enable: false } }
- say: "turn on alerts for my line"
  tags: [watch_line, demo]
  expect: { tool: watch_line, args: { line: self, enable: true } }
- say: "turn off the alerts on my number"
  tags: [watch_line]
  expect: { tool: watch_line, args: { line: self, enable: false } }
- say: "am i watching mom's line"
  tags: [watch_line, status]
  expect: { tool: watch_line, args: { line: mom, enable: null } }
- say: "are alerts on for my line"
  tags: [watch_line, status]
  expect: { tool: watch_line, args: { line: self, enable: null } }
- say: "keep an eye on mom's number and ping me if it gets forwarded"
  tags: [watch_line, slang]
  expect: { tool: watch_line, args: { line: mom, enable: true } }
- say: "quit texting me about mom's phone"
  tags: [watch_line, slang]
  expect: { tool: watch_line, args: { line: mom, enable: false } }
- say: "let me know by text if my sim ever gets swapped"
  tags: [watch_line]
  expect: { tool: watch_line, args: { line: self, enable: true } }

# --- off-topic: no tool -----------------------------------------------------------------------------------
- say: "what's the weather in ottawa"
  tags: [off-topic]
  expect: { tool: null }
- say: "play some jazz"
  tags: [off-topic]
  expect: { tool: null }
- say: "set a timer for ten minutes"
  tags: [off-topic]
  expect: { tool: null }
- say: "what's a good phone plan for a teenager"
  tags: [off-topic, near-miss]
  expect: { tool: null }
- say: "how do i turn on airplane mode"
  tags: [off-topic, near-miss]
  expect: { tool: null }

# --- ambiguous: ask which line ----------------------------------------------------------------------------
- say: "is the line ok"
  tags: [ambiguous]
  expect: { clarify: true }
- say: "check the phone"
  tags: [ambiguous]
  expect: { clarify: true }
- say: "is it still switched on"
  tags: [ambiguous]
  expect: { clarify: true }

# --- wrong language: Alexa+ is English (US); either the right call or no call, never a wrong tool -----------
- say: "est-ce que ma ligne va bien"
  tags: [wrong-language]
  expect_any:
    - { tool: line_is_ok, args: { line: self } }
    - { tool: null }
- say: "el teléfono de mamá está encendido"
  tags: [wrong-language]
  expect_any:
    - { tool: is_reachable, args: { line: mom } }
    - { tool: null }
