{% if entries %}
<ol class="timeline sms">{% for e in entries %}
  <li class="ev ev-sms" data-n="{{ e.n }}" data-role="{{ e.role }}" data-template="{{ e.template }}">
    <span class="ev-icon" aria-hidden="true"><svg class="i"><use href="/static/img/icons.svg#envelope"></use></svg></span>
    <div class="ev-body">
      <p class="ev-head"><time class="ts">{{ e.at }}</time> <b class="role">{{ e.role }}</b> <span class="who">{{ e.user_id }}</span> <span class="tpl">{{ e.template }}</span></p>
      <p class="sms-text">{{ e.body }}</p>
    </div>
  </li>{% endfor %}
</ol>
{% else %}<p class="empty">no SMS sent yet</p>{% endif %}
