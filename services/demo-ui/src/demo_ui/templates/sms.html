{% if entries %}
<div class="sms-phone" role="group" aria-label="a mocked phone showing the texts Alerts sent (each one went to that person's own phone)">
  <div class="sms-screen">
    <p class="sms-top"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#envelope"></use></svg>Messages <span class="muted">· from Alerts · newest first</span></p>
    <ol class="timeline sms">{% for e in entries %}
      <li class="ev ev-sms" data-n="{{ e.n }}" data-role="{{ e.role }}" data-template="{{ e.template }}">
        <p class="ev-head"><b class="role">{{ e.role }}</b> <span class="who">{{ e.user_id }}</span> <time class="ts">{{ e.at }}</time></p>
        <p class="sms-text">{{ e.body }}</p>
        <p class="tpl">{{ e.template }}</p>
      </li>{% endfor %}
    </ol>
  </div>
</div>
{% else %}<p class="empty">no SMS sent yet</p>{% endif %}
