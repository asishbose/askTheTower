{% if job %}<span class="ops-badge s-{{ job.state }}" data-state="{{ job.state }}" data-job="{{ job.name }}" title="{{ job.label }}"><b>{{ job.name }}</b> · {{ "running…" if job.state == "running" else job.state }}{% if job.code is not none %} · exit {{ job.code }}{% endif %}{% if job.duration %} · {{ job.duration }}{% endif %}</span>{% else %}<span class="ops-badge s-idle" data-state="idle">no job yet</span>{% endif %}
