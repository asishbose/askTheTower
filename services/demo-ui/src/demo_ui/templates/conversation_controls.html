<div class="macros{% if not carrier %} off{% endif %}">
  {% for name, label in macros %}
  <button class="tile" data-macro="{{ name }}" {% if not carrier %}disabled title="{{ off_reason }}"{% endif %} hx-post="/macro/{{ name }}" hx-target="#run-status" hx-swap="innerHTML"><svg class="tile-art" aria-hidden="true"><use href="/static/img/icons.svg#m-{{ name }}"></use></svg><span class="tile-name">{{ label }}</span><span class="tile-state" aria-hidden="true"></span></button>
  {% endfor %}
</div>
{% if not carrier %}<div class="off-panel" data-off><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#pause"></use></svg><p class="off">{{ off_reason }}</p></div>{% endif %}
{% for name, label in macros %}{% if captions[name] %}<p class="caption"><b>{{ label }}:</b> {{ captions[name] }}</p>{% endif %}{% endfor %}
<form class="say" hx-post="/say" hx-target="#run-status" hx-swap="innerHTML">
  <select name="who" aria-label="who speaks" {% if personas | length == 1 %}disabled{% endif %}>
    {% for p in personas %}<option value="{{ p }}">{{ p | capitalize }}</option>{% endfor %}
  </select>
  {% if personas | length == 1 %}<input type="hidden" name="who" value="{{ personas[0] }}">{% endif %}
  <input name="text" maxlength="200" aria-label="what they say" placeholder="{{ 'Is my line OK?' if free_text else 'free text needs Bedrock' }}" {% if not free_text %}disabled{% endif %}>
  <button class="btn primary" {% if not free_text %}disabled{% endif %}><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#send"></use></svg>Say</button>
</form>
