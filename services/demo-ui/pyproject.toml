[project]
name = "demo-ui"
version = "0.1.0"
description = "Demo control room (laptop only): conversation, carrier controls, live feed and binding QR in one page."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "boto3>=1.35",
  "segno>=1.6",
  "ref-client",
  "tower-consent",
  "tower-audit",
]

[project.scripts]
demo-ui = "demo_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_ui"]

[tool.uv.sources]
ref-client = { workspace = true }
tower-consent = { workspace = true }
tower-audit = { workspace = true }
