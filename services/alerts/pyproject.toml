[project]
name = "alerts"
version = "0.1.0"
description = "Alerts service: webhooks, polls, windows, escalation, SNS."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "tower-policy",
  "tower-consent",
  "tower-audit",
  "camara-client",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "boto3>=1.35",
  "awslambdaric>=3.0",  # Lambda container entry point (prompt 13: python -m awslambdaric <handler>)
]

[project.scripts]
alerts-local = "alerts.local:main"

[tool.uv.sources]
tower-policy = { workspace = true }
tower-consent = { workspace = true }
tower-audit = { workspace = true }
camara-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]
