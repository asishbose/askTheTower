[project]
name = "tower-consent"
version = "0.1.0"
description = "Consent and line-binding library: DynamoDB tables, HMAC/encryption helpers, resolve()."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "tower-policy", "boto3>=1.35", "cryptography>=43"]

[tool.uv.sources]
tower-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_consent"]
