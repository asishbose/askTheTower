[project]
name = "tower-audit"
version = "0.1.0"
description = "Hash-chained audit log: append-before-release, verify, trim, recent_checks."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "tower-policy", "tower-consent", "boto3>=1.35"]

[tool.uv.sources]
tower-policy = { workspace = true }
tower-consent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_audit"]
