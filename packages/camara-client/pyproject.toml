[project]
name = "camara-client"
version = "0.1.0"
description = "CarrierClient protocol with DirectClient and GatewayClient; CAMARA error mapping, timeouts, breaker."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "httpx2>=2.13",
  "fastmcp>=4.0",
  "botocore>=1.35",
  "tower-policy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camara_client"]

[tool.uv.sources]
tower-policy = { workspace = true }
