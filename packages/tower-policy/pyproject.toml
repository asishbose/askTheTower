[project]
name = "tower-policy"
version = "0.1.0"
description = "Deterministic policy engine: reason codes, thresholds, phrasing templates. Shared by Tower and Alerts."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_policy"]
