{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tower-mcp.fullname" . }}
  labels:
    {{- include "tower-mcp.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "tower-mcp.selectorLabels" . | nindent 6 }}
{{- end }}
