apiVersion: v1
kind: Service
metadata:
  name: {{ include "alerts.fullname" . }}
  labels:
    {{- include "alerts.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "alerts.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.tls.enabled }}
    - name: hooks
      port: {{ .Values.tls.port }}
      targetPort: hooks
      protocol: TCP
    {{- end }}
