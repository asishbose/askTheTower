suite: ref-client
templates:
  - templates/job.yaml
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
  - templates/web.yaml
tests:
  - it: renders nothing to run by default
    asserts:
      - template: templates/job.yaml
        hasDocuments: {count: 0}
      - template: templates/deployment.yaml
        hasDocuments: {count: 0}
      - template: templates/web.yaml
        hasDocuments: {count: 0}
  - it: web chat agent is the image's `serve` command behind a ClusterIP Service, no Ingress by default
    template: templates/web.yaml
    values:
      - ../../ref-client/values-kind.yaml
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: Deployment}
        documentIndex: 0
      - equal: {path: metadata.name, value: ref-client-web}
        documentIndex: 0
      - equal: {path: "spec.template.spec.containers[0].args", value: [serve]}
        documentIndex: 0
      - equal: {path: "spec.template.spec.containers[0].readinessProbe.httpGet.path", value: /healthz}
        documentIndex: 0
      - equal: {path: "spec.template.spec.containers[0].livenessProbe.httpGet.path", value: /ping}
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TOWER_ENV, value: local}
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: REF_CLIENT_HTTP_PORT, value: "8080"}
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: WEB_CHAT_DIR, value: /app/web-chat}
        documentIndex: 0
      - equal: {path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true}
        documentIndex: 0
      - isKind: {of: Service}
        documentIndex: 1
      - equal: {path: spec.type, value: ClusterIP}
        documentIndex: 1
      - equal: {path: "spec.ports[0].port", value: 8080}
        documentIndex: 1
  - it: on EKS the agent has no page and no stub (TOWER_ENV=aws, WEB_CHAT_DIR dropped)
    template: templates/web.yaml
    values:
      - ../../ref-client/values-eks.yaml
    asserts:
      - hasDocuments: {count: 2}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TOWER_ENV, value: aws}
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: WEB_CHAT_DIR, value: /app/web-chat}
        documentIndex: 0
  - it: an Ingress only when asked for
    template: templates/web.yaml
    set:
      web.enabled: true
      web.ingress.enabled: true
      web.ingress.host: chat.example.org
    asserts:
      - hasDocuments: {count: 3}
      - isKind: {of: Ingress}
        documentIndex: 2
      - equal: {path: "spec.rules[0].host", value: chat.example.org}
        documentIndex: 2
  - it: runs `ref-client demo --env <envName>` as a Job per revision
    template: templates/job.yaml
    release:
      revision: 3
    set:
      job.enabled: true
      envName: eks
    asserts:
      - isKind: {of: Job}
      - equal: {path: metadata.name, value: ref-client-demo-3}
      - equal: {path: "spec.template.spec.containers[0].args", value: [demo, --env, eks]}
      - equal: {path: spec.template.spec.restartPolicy, value: Never}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TOWER_URL, value: "http://tower-mcp:8000/mcp"}
  - it: never hands the DynamoDB Local dummy credentials to the client (Bedrock detection)
    template: templates/job.yaml
    set:
      job.enabled: true
      global.storeEnv: {AWS_ACCESS_KEY_ID: dynamodblocal}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AWS_ACCESS_KEY_ID, value: dynamodblocal}
  - it: optional toolbox Deployment
    template: templates/deployment.yaml
    set:
      deployment.enabled: true
    asserts:
      - equal: {path: "spec.template.spec.containers[0].command", value: [sleep, infinity]}
  - it: IRSA annotation for Bedrock
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/att-ref-client}
    asserts:
      - equal: {path: metadata.name, value: ref-client}
