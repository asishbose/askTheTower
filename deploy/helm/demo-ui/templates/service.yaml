{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-ui.fullname" . }}
  labels:
    {{- include "demo-ui.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # never an Ingress or LoadBalancer: port-forward from the laptop only
  selector:
    {{- include "demo-ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
