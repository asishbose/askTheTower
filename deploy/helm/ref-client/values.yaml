# ref-client — one image, ENTRYPOINT ref-client: the default command `serve` is the web chat agent's HTTP app (09 §6),
# `demo` / `say` / `corpus` the CLI. Bedrock (BEDROCK_MODEL_ID) through IRSA on EKS; with no AWS credentials
# REF_AGENT=auto falls back to the scripted agent.
image:
  registry: ""
  repository: ask-the-tower/ref-client
  tag: ""
  pullPolicy: ""

useStoreEnv: false
envName: local       # `ref-client demo --env <envName>`

env:
  TOWER_URL: http://tower-mcp:8000/mcp
  MOCK_URL: http://mock-carrier:8443
  BINDING_URL: http://binding-page:8081
  REF_AGENT: auto
  REF_ARTIFACTS_DIR: /out
  BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
  AWS_REGION: us-east-1
  HOME: /tmp
secretEnv:
  TOWER_BEARER: {name: "", key: TOWER_BEARER}

# The demo as a Job (named per release revision, so an upgrade runs it again). Transcripts go to stdout and /out.
job:
  enabled: false
  args: []           # default: [demo, --env, <envName>]
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

# Optional long-running toolbox: `kubectl exec deploy/ref-client -- ref-client say "..."`.
deployment:
  enabled: false

# The web chat agent (09 §6): Deployment + ClusterIP Service `ref-client-web` on 8080 (templates/web.yaml).
# kubectl -n ask-the-tower port-forward svc/ref-client-web 8083:8080 → http://127.0.0.1:8083/
# Its env is `env` above plus `web.env`; TOWER_BEARER (secretEnv) is the local bearer the page stub uses.
web:
  enabled: false
  replicas: 1
  port: 8080
  service:
    port: 8080
  env:
    TOWER_ENV: local                              # GET /config.js (the sign-in stub) exists only with local
    WEB_CHAT_BINDING_BASE_URL: http://localhost:8081
    WEB_CHAT_DIR: /app/web-chat                   # the page, baked into the image
  ingress:
    enabled: false                                # never by default: /config.js carries the local bearer
    className: ""
    host: ""
    annotations: {}
    tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}   # EKS: IRSA role with bedrock:InvokeModel on the one model only

podSecurityContextOverride: {}
resources:
  requests: {cpu: 50m, memory: 160Mi}
  limits: {cpu: 500m, memory: 384Mi}

# Set by the umbrella chart (deploy/helm/umbrella); these defaults make the chart render on its own.
global:
  imageRegistry: ""
  imageTag: ""
  imagePullPolicy: ""
  secretName: att-secrets
  storeEnv: {}
  storeSecretEnv: {}
  nodeSelector: {}

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
