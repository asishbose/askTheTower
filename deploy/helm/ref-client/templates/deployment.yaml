{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ref-client.fullname" . }}
  labels:
    {{- include "ref-client.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ref-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ref-client.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ref-client.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "ref-client.podSecurityContext" . | nindent 8 }}
      {{- include "ref-client.scheduling" . | nindent 6 }}
      containers:
        - name: ref-client
          image: {{ include "ref-client.image" . | quote }}
          imagePullPolicy: {{ include "ref-client.pullPolicy" . }}
          command: [sleep, infinity]
          env:
            {{- include "ref-client.env" . | nindent 12 }}
          securityContext:
            {{- include "ref-client.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: out
              mountPath: /out
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: out
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
