# ask-the-tower umbrella — target-neutral defaults. Install with one of:
#   values-kind.yaml  (no cloud: DynamoDB Local, local keys, TOWER_ENV=local — the compose stack on kind)
#   values-eks.yaml + values-eks.generated.yaml  (scripts/render_values.py from terraform outputs: real DynamoDB,
#                     KMS, SNS, ECR images, IRSA roles, ALB hosts)
global:
  imageRegistry: ""
  imageTag: latest
  imagePullPolicy: IfNotPresent
  # One Secret holds every generated value (bearers, session key, local crypto keys, the mock's JWT key, the
  # mock-registry client secrets). Created by this chart with random values on first install and kept on upgrade
  # (lookup); never in git. Set secrets.create=false to bring your own Secret with the same keys.
  secretName: att-secrets
  # Store + crypto variables every store-using service gets (tower-mcp, binding-page, alerts, the seed Job).
  storeEnv:
    TOWER_ENV: local
    AWS_REGION: us-east-1
    TOWER_TABLE_PREFIX: ""
    DYNAMO_ENDPOINT: ""
    TOWER_KMS_KEY_ID: ""
    TOWER_KMS_HMAC_KEY_ID: ""
    LOG_LEVEL: info
    PYTHONUNBUFFERED: "1"
    HOME: /tmp
  storeSecretEnv: {}
  nodeSelector: {}

secrets:
  create: true
  # The mock carrier's client registry (services/mock-carrier/config/clients.yaml): placeholders the in-cluster
  # mock accepts — not carrier credentials. A real carrier's secrets go to AgentCore Identity, never here.
  carrierClientSecrets:
    TOWER_CARRIER_CLIENT_SECRET: local-dev-tower
    BINDING_CARRIER_CLIENT_SECRET: local-dev-binding
    ALERTS_CARRIER_CLIENT_SECRET: local-dev-alerts

# https for Alerts' webhook sinks inside the cluster (CAMARA sinks must be https://): a CA and a certificate for
# `alerts` generated by Helm (genCA/genSignedCert; kept on upgrade). The alerts tls sidecar serves it and the mock
# trusts the CA (mock-carrier.trustCA). kind only — on EKS the ALB terminates TLS with ACM.
localTls:
  enabled: false
  secretName: alerts-tls
  caConfigMap: att-local-ca
  dnsNames: [alerts]

# The demo seed (scripts/k8s_seed.py, the same seed as compose / AWS) as a post-install/post-upgrade hook Job.
# Its script files are copied into files/ by `uv run python scripts/k8s_seed.py --sync-chart` (make helm-*).
seed:
  enabled: false
  serviceAccountName: ""     # EKS: tower-mcp (its IRSA role covers the tables and both keys)
  mockUrl: http://mock-carrier:8443
  bindingUrl: http://binding-page:8081
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: 500m, memory: 384Mi}

mock-carrier:
  enabled: true
tower-mcp:
  enabled: true
binding-page:
  enabled: true
alerts:
  enabled: true
ref-client:
  enabled: true
# The demo control room (doc 11): laptop tooling, on only with values-kind.yaml. Never on a cloud cluster.
demo-ui:
  enabled: false
dynamodb-local:
  enabled: false
