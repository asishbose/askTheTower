{{- if .Values.secrets.create }}
{{- $name := .Values.global.secretName }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
# Generated in-cluster on first install (randAlphaNum), kept on upgrade; never rendered into git. The two local
# crypto keys are base64 of >= 32 bytes, as tower_consent expects; they are used only with TOWER_ENV=local (kind).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "att.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "TOWER_BEARER" "INTERNAL_BEARER" "SESSION_SECRET" "MOCK_JWT_SECRET" }}
  {{ $key }}: {{ include "att.keep" (dict "existing" $existing "key" $key "fresh" (randAlphaNum 48 | b64enc)) }}
  {{- end }}
  {{- range $key := list "TOWER_LINE_ID_KEY" "TOWER_MSISDN_KEY" }}
  {{ $key }}: {{ include "att.keep" (dict "existing" $existing "key" $key "fresh" (randAlphaNum 44 | b64enc | b64enc)) }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.carrierClientSecrets }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
