{{- if .Values.networkPolicy.enabled }}
# Ingress allow-list for binding-page (prompt 14 step 1). Egress is open (DNS, AWS APIs, the carrier). kind's default
# CNI does not enforce NetworkPolicy; EKS does with the VPC CNI network-policy agent (deploy/terraform/eks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "binding-page.fullname" . }}
  labels:
    {{- include "binding-page.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "binding-page.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.port }}
      {{- $r := .Values.networkPolicy.from }}
      {{- if not $r.allowAll }}
      from:
        {{- include "binding-page.npFrom" $r | nindent 8 }}
      {{- end }}
{{- end }}
